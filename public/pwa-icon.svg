<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#241442" />
      <stop offset="60%" stop-color="#0e081c" />
      <stop offset="100%" stop-color="#08060f" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d8b4fe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  
  <!-- Outer subtle ring -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3" />

  <!-- Glowing emblem orb -->
  <circle cx="256" cy="256" r="160" fill="url(#ringGrad)" opacity="0.18" filter="url(#glow)" />
  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#ringGrad)" stroke-width="8" />

  <!-- Inner glass circle -->
  <circle cx="256" cy="256" r="128" fill="#130d24" stroke="rgba(255,255,255,0.18)" stroke-width="2" />

  <!-- Initials "OY" -->
  <text x="256" y="295" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="800" 
        font-size="118" 
        letter-spacing="2" 
        fill="url(#textGrad)" 
        text-anchor="middle">OY</text>
  
  <!-- Small dot accent -->
  <circle cx="340" cy="210" r="10" fill="#ec4899" />
</svg>
