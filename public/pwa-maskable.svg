<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="mBgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#241442" />
      <stop offset="60%" stop-color="#0e081c" />
      <stop offset="100%" stop-color="#08060f" />
    </radialGradient>
    <linearGradient id="mRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="mTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d8b4fe" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background for maskable (Android will crop to circle/squircle) -->
  <rect width="512" height="512" fill="url(#mBgGlow)" />

  <!-- Inside 80% safe zone (circle r=170) -->
  <circle cx="256" cy="256" r="140" fill="url(#mRingGrad)" opacity="0.22" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#mRingGrad)" stroke-width="8" />
  <circle cx="256" cy="256" r="112" fill="#130d24" stroke="rgba(255,255,255,0.18)" stroke-width="2" />

  <!-- Initials "OY" sized inside safe-zone -->
  <text x="256" y="290" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="800" 
        font-size="104" 
        letter-spacing="2" 
        fill="url(#mTextGrad)" 
        text-anchor="middle">OY</text>

  <circle cx="330" cy="216" r="9" fill="#ec4899" />
</svg>
